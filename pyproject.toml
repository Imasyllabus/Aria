[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-mail"
version = "0.1.0"
description = "Sift: a standalone, portable Gmail + Outlook inbox triage tool — classify, prioritize, categorize, and clean up mail."
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Gmail
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    # Outlook (Microsoft Graph)
    "msal>=1.24",
    "requests>=2.31",
    # AI classification (optional at runtime; rules-only mode needs no key)
    "anthropic>=0.40",
    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sift*"]
